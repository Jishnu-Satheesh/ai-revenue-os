name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused files, exports, and dependencies
        run: pnpm knip

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: pnpm supabase:start

      # Migrations and RLS are the tenant-isolation boundary. pgTAP runs on
      # every change because a policy regression is not visible to unit tests.
      - name: Run pgTAP suites
        run: pnpm db:test

      # `supabase gen types` needs Docker for both --local and --db-url, and no
      # developer on this project has it: there is no local or development
      # database, only the hosted staging project. CI is the only place the
      # generator can run, so failing the build on a diff would block work that
      # nobody is able to unblock. The generated file is published as an
      # artifact instead, to be adopted deliberately when the module workarounds
      # in Memory and Integrations are unwound.
      #
      # The drift that actually costs — a migration adding a column to a table
      # the application already types — is enforced without a database at all by
      # src/lib/supabase/database.types.test.ts, which runs in the verify job.
      - name: Generate types for review
        run: |
          pnpm db:types
          cp src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.generated.ts"
          git --no-pager diff --stat src/lib/supabase/database.types.ts || true
          git checkout -- src/lib/supabase/database.types.ts

      - name: Upload generated types
        uses: actions/upload-artifact@v4
        with:
          name: database-types-generated
          path: ${{ runner.temp }}/database.types.generated.ts
          if-no-files-found: error

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-time-placeholder

      # Authenticated specs skip themselves when E2E_* secrets are absent, so a
      # fork PR runs the unauthenticated suite rather than failing on secrets.
      - name: Run Playwright
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_INTEGRATION_ORGANIZATION_ID: ${{ secrets.E2E_INTEGRATION_ORGANIZATION_ID }}
          E2E_OTHER_ORGANIZATION_ID: ${{ secrets.E2E_OTHER_ORGANIZATION_ID }}
          E2E_OPERATOR_EMAIL: ${{ secrets.E2E_OPERATOR_EMAIL }}
          E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
