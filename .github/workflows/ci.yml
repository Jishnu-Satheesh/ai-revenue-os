# CI — runs on every pull request, against any branch.
#
# This is the quality gate: broken code never reaches staging or main.
# It runs the repo's own checks (typecheck, lint, format, full unit suite).
# Database migrations and Trigger.dev deploys live in deploy-staging.yml
# and deploy-production.yml, which run only on merge, never on PRs.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test
