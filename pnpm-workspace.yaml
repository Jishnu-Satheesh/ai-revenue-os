allowBuilds:
  '@depot/cli': true
  '@tailwindcss/oxide': true
  esbuild: true
  # msw's postinstall writes the browser service worker into a public directory.
  # Tests run through msw/node, so the worker is not needed.
  msw: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@2.112.0'
  - '@supabase/cli-darwin-x64@2.112.0'
  - '@supabase/cli-linux-arm64-musl@2.112.0'
  - '@supabase/cli-linux-arm64@2.112.0'
  - '@supabase/cli-linux-x64-musl@2.112.0'
  - '@supabase/cli-linux-x64@2.112.0'
  - '@supabase/cli-windows-arm64@2.112.0'
  - '@supabase/cli-windows-x64@2.112.0'
  - supabase@2.112.0
  - '@napi-rs/canvas-android-arm64@1.0.8'
  - '@napi-rs/canvas-darwin-arm64@1.0.8'
  - '@napi-rs/canvas-darwin-x64@1.0.8'
  - '@napi-rs/canvas-linux-arm-gnueabihf@1.0.8'
  - '@napi-rs/canvas-linux-arm64-gnu@1.0.8'
  - '@napi-rs/canvas-linux-arm64-musl@1.0.8'
  - '@napi-rs/canvas-linux-riscv64-gnu@1.0.8'
  - '@napi-rs/canvas-linux-x64-gnu@1.0.8'
  - '@napi-rs/canvas-linux-x64-musl@1.0.8'
  - '@napi-rs/canvas-win32-arm64-msvc@1.0.8'
  - '@napi-rs/canvas-win32-x64-msvc@1.0.8'
  - '@napi-rs/canvas@1.0.8'
  - '@ai-sdk/gateway@3.0.191'
  - '@ai-sdk/google@3.0.122'
  - '@ai-sdk/provider-utils@4.0.51'
  - '@ai-sdk/provider@3.0.16'
  - ai@6.0.280
